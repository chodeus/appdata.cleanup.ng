name: Stale issues & PRs

on:
  schedule:
    - cron: '0 5 * * *'  # daily
  workflow_dispatch:

# Required: a reusable workflow cannot exceed the caller's grant, and this
# repo's default token is read-only, so without these the run fails at startup.
permissions:
  issues: write
  pull-requests: write
  # actions/stale replaces its saved-progress cache via the caches API.
  actions: write

jobs:
  stale:
    uses: chodeus/chodeus-ops/.github/workflows/stale-issues.yml@c615a871ba4dfa791eac921b5b8e45652459b20b # main
