name: Release

# Pushes touching plugin files refresh the "chore(main): release" PR; merging it cuts the release.
# Needs the RELEASE_TOKEN secret. Mechanics: chodeus-ops unraid-plugin-release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'pkg_build.sh'
      - 'plugins/appdata.cleanup.ng.plg'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = cut a release if a merged release PR has none yet, else refresh the release PR; pr = refresh the release PR; release = cut a release from this branch'
        type: choice
        options: [auto, pr, release]
        default: auto
      dry_run:
        description: 'Run everything except pushes, tags and the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plg-release
  cancel-in-progress: false

jobs:
  release:
    # What the called job asks for; GitHub checks it against this grant when the run starts.
    permissions:
      contents: read
      actions: write
    uses: chodeus/chodeus-ops/.github/workflows/unraid-plugin-release.yml@34d60eb64219dd4f9e37c8c7176f02b5216029fe # main
    with:
      plg_file: plugins/appdata.cleanup.ng.plg
      stable_branch: main
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  notify-failure:
    needs: release
    if: failure()
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@cbd544d21103cfe854c8e0ec717ee2be4f097ad7 # main
    with:
      event_type: build
      status: failure
      title: "❌ Plugin release failed: ${{ github.ref_name }}"
      description: The release run failed; see the run for the step and whether anything was pushed.
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
