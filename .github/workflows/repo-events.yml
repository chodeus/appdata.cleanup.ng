name: Repo events

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  release:
    types: [published]
  discussion:
    types: [created]

jobs:
  notify:
    # The reusable needs no API access; an empty grant stops repo defaults widening it.
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/repo-events.yml@f35f1f8b3e78542fc99e8c2b075a7685b3f5b9b9 # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
