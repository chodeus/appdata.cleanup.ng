name: Repo events

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  release:
    types: [published]
  discussion:
    types: [created]

jobs:
  notify:
    # The reusable needs no API access; an empty grant stops repo defaults widening it.
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/repo-events.yml@c615a871ba4dfa791eac921b5b8e45652459b20b # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
