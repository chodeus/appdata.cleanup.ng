# Drop into .github/workflows/repo-events.yml of ANY repo.
# Fires Discord for: issue open/close, PR open/close/merge, release publish, discussion.
# Workflow-failure notifications are handled inline by the failing caller workflow (see caller-docker.yml).

name: Repo events

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  release:
    types: [published]
  discussion:
    types: [created]

jobs:
  notify:
    # The reusable needs no API access; an empty grant stops repo defaults widening it.
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/repo-events.yml@a08ae6259fdba04b2f97e846544e8afdb8bb36fd # main
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
