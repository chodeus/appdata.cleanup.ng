name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: PHP syntax check
        run: |
          status=0
          while IFS= read -r f; do
            php -l "$f" || status=1
          done < <(find source -name '*.php')
          exit $status

      - name: Function checker self-test
        run: php .github/scripts/check-plugin-functions.test.php

      - name: Every plugin function called is defined
        run: php .github/scripts/check-plugin-functions.php source

      # It creates folders under /mnt, so only inside this throwaway container.
      - name: A delete reaches nothing outside the folder
        uses: docker://php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
        with:
          entrypoint: php
          args: .github/scripts/delete-scope.test.php

      # Community Applications' shipped package (readXmlFile), pinned by commit and md5
      - name: Fetch the template reader
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ca.txz" https://raw.githubusercontent.com/unraid/community.applications/e8472f00df8a677f2f39b28e9e7bf8b0a2fe5de5/archive/community.applications-2026.07.21-x86_64-1.txz
          echo "6c324a04c1403180c233eb74675b2e20  $RUNNER_TEMP/ca.txz" | md5sum -c -
          mkdir -p .ca-reader
          tar --warning=no-unknown-keyword -xJf "$RUNNER_TEMP/ca.txz" -C .ca-reader ./usr/local/emhttp/plugins/community.applications/include/helpers.php

      - name: Stale templates and folder sizes
        uses: docker://php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
        env:
          ACNG_TEST_CA_HELPERS: .ca-reader/usr/local/emhttp/plugins/community.applications/include/helpers.php
        with:
          entrypoint: php
          args: .github/scripts/stale-and-size.test.php

      - name: Validate plugin manifest (XML)
        run: xmllint --noout plugins/appdata.cleanup.ng.plg

      # It writes /boot/config and /mnt/user/appdata, so only inside this throwaway container.
      - name: Compose protection and the ignore list
        uses: docker://php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
        with:
          entrypoint: php
          args: .github/scripts/compose-protection.test.php

      # The plugin reads stacks with docker compose itself; this runner's copy is the real thing to test against.
      - name: Hand this runner's docker compose to the next step
        run: |
          mkdir -p .compose-bin
          cp "$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')" .compose-bin/docker-compose
          .compose-bin/docker-compose version

      # It writes /boot/config and /mnt/user/appdata, so only inside this throwaway container.
      - name: Docker compose reads the stacks
        uses: docker://php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
        env:
          ACNG_TEST_COMPOSE: .compose-bin/docker-compose
        with:
          entrypoint: php
          args: .github/scripts/compose-config.test.php

      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chodeus/chodeus-ops
          ref: 4d8f3ecd9b7803badffe354a689960c8866ce1fb # main
          path: .ops
          sparse-checkout: scripts

      # CHANGELOG.md must render to the committed CHANGES block, pluginURL must point at this
      # branch, and the md5 in the manifest must match the package actually served for it.
      - name: Verify changelog, manifest and served package agree
        run: |
          python3 .ops/scripts/plg_release.py check \
            --changelog CHANGELOG.md --plg plugins/appdata.cleanup.ng.plg \
            --channel stable --branch "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" --verify-asset

      - name: Test build
        run: |
          bash pkg_build.sh --version 0000.00.00 --branch main
          test -f dist/appdata.cleanup.ng-0000.00.00-x86_64-1.txz

  notify-failure:
    needs: validate
    if: failure() && github.event_name != 'pull_request'
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@c615a871ba4dfa791eac921b5b8e45652459b20b # main
    with:
      event_type: build
      status: failure
      title: "❌ CI failed: ${{ github.ref_name }}"
      description: Validation failed; see the run.
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
